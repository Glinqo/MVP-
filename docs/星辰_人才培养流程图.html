<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星辰 · 人才培养双线闭环流程图</title>
  <style>
    :root {
      --bg: #0a1628;
      --bg-gradient: linear-gradient(135deg, #0a1628 0%, #1a2a4a 40%, #1e3a5f 100%);
      --panel-solid: #0f1d35;
      --glass: rgba(255,255,255,0.04);
      --glass-hover: rgba(255,255,255,0.08);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --muted: #64748b;
      --line: rgba(255,255,255,0.10);
      --line-strong: rgba(255,255,255,0.16);
      --primary: #0f766e;
      --primary-light: #14b8a6;
      --accent-blue: #38bdf8;
      --accent-purple: #a78bfa;
      --warning: #fbbf24;
      --weak: #fb7185;
      --success: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-gradient);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .board {
      position: relative;
      width: 1600px;
      height: 1420px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 50% at 10% 90%, rgba(15,118,110,0.16) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 90% 10%, rgba(56,189,248,0.11) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(168,85,247,0.07) 0%, transparent 60%),
        var(--bg-gradient);
    }

    .board::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent 22%, transparent 78%, rgba(0,0,0,0.22));
    }

    #starfield {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 0 0 8px rgba(56,189,248,0.75);
      opacity: 0.55;
    }

    .header {
      position: absolute;
      z-index: 3;
      top: 24px;
      left: 70px;
      right: 70px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .title-block {
      position: relative;
    }

    .eyebrow {
      color: var(--primary-light);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--text);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 20px;
      letter-spacing: 0.4px;
    }

    .flow-title {
      position: absolute;
      z-index: 3;
      left: 38px;
      top: 200px;
      color: #e2e8f0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 7px;
      line-height: 1.15;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      text-shadow: 0 0 18px rgba(20,184,166,0.24);
    }

    .flow-title span {
      color: #14b8a6;
    }

    .legend {
      display: flex;
      gap: 10px;
      align-items: center;
      padding-bottom: 2px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      padding: 9px 14px;
      font-size: 17px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }

    .connectors {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 1420px;
      z-index: 1;
      pointer-events: none;
    }

    .connector-line {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.86;
      filter: drop-shadow(0 0 4px rgba(20,184,166,0.25));
    }

    .connector-line.teacher {
      stroke: #fbbf24;
      filter: drop-shadow(0 0 5px rgba(251,191,36,0.28));
    }

    .connector-line.student {
      stroke: #38bdf8;
      filter: drop-shadow(0 0 5px rgba(56,189,248,0.30));
    }

    .connector-line.system {
      stroke: #14b8a6;
      filter: drop-shadow(0 0 6px rgba(20,184,166,0.42));
    }

    .connector-line.dashed {
      stroke-dasharray: 7 8;
      stroke: #14b8a6;
      opacity: 0.72;
      filter: drop-shadow(0 0 5px rgba(20,184,166,0.28));
    }

    .node {
      position: absolute;
      z-index: 2;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.045);
      box-shadow: 0 8px 30px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.035);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .node::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 42%);
    }

    .node-title {
      margin: 0 0 7px;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }

    .node-sub {
      margin: 0;
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1.55;
    }

    .node.teacher .node-icon { background: rgba(251,191,36,0.16); color: #fde68a; }
    .node.teacher { border-color: rgba(251,191,36,0.30); }
    .node.teacher .node-title { color: #fde68a; }

    .node.student .node-icon { background: rgba(56,189,248,0.16); color: #bae6fd; }
    .node.student { border-color: rgba(56,189,248,0.28); }
    .node.student .node-title { color: #bae6fd; }

    .node.system .node-icon { background: rgba(20,184,166,0.18); color: #99f6e4; }
    .node.system { border-color: rgba(20,184,166,0.42); background: rgba(15,118,110,0.10); box-shadow: 0 0 34px rgba(20,184,166,0.13), 0 8px 30px rgba(0,0,0,0.34); }
    .node.system .node-title { color: #99f6e4; }

    .node.insight { border-color: rgba(56,189,248,0.28); }
    .node.insight .node-icon { background: rgba(56,189,248,0.16); color: #bae6fd; }
    .node.insight .node-title { color: #bae6fd; }

    .node.action { border-color: rgba(56,189,248,0.28); }
    .node.action .node-icon { background: rgba(56,189,248,0.16); color: #bae6fd; }
    .node.action .node-title { color: #bae6fd; }

    .node.input {
      left: 540px;
      top: 120px;
      width: 520px;
      height: 122px;
      padding: 20px 22px;
    }

    .node.system {
      left: 500px;
      top: 282px;
      width: 600px;
      height: 150px;
      padding: 22px 24px;
    }

    .node.student.assessment {
      left: 550px;
      top: 488px;
      width: 500px;
      height: 130px;
      padding: 20px 22px;
    }

    .node.teacher.assessment {
      left: 550px;
      top: 668px;
      width: 500px;
      height: 130px;
      padding: 20px 22px;
    }

    .node.insight.issue {
      left: 120px;
      top: 872px;
      width: 500px;
      height: 118px;
      padding: 18px 20px;
    }

    .node.teacher.issue {
      left: 980px;
      top: 872px;
      width: 500px;
      height: 118px;
      padding: 18px 20px;
    }

    .node.action {
      left: 120px;
      top: 1048px;
      width: 500px;
      height: 150px;
      padding: 20px 22px;
    }

    .node.teacher.action {
      left: 980px;
      top: 1048px;
      width: 500px;
      height: 150px;
      padding: 20px 22px;
    }

    .node.system.closure {
      left: 500px;
      top: 1258px;
      width: 600px;
      height: 108px;
      padding: 18px 22px;
      display: block;
    }

    .lane-label {
      position: absolute;
      z-index: 2;
      top: 842px;
      width: 500px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .lane-label.student { left: 120px; }
    .lane-label.teacher { left: 980px; }

    .path-label {
      position: absolute;
      z-index: 2;
      color: #a78bfa;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .loop-label {
      position: absolute;
      right: 70px;
      top: 800px;
      color: #5eead4;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      z-index: 2;
    }

    .node .small-tag {
      display: inline-flex;
      align-items: center;
      margin-top: 7px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(255,255,255,0.035);
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1;
      padding: 6px 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="board">
    <div id="starfield"></div>
    <div class="flow-title"><span>星辰</span> · 人才培养双线闭环流程图</div>

    <svg class="connectors" viewBox="0 0 1600 1420" aria-hidden="true">
      <defs>
        <marker id="arrow-system" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,4.5 L0,9 z" fill="#14b8a6"/>
        </marker>
        <marker id="arrow-student" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,4.5 L0,9 z" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-teacher" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,4.5 L0,9 z" fill="#fbbf24"/>
        </marker>
        <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,4.5 L0,9 z" fill="#14b8a6"/>
        </marker>
      </defs>

      <!-- Input to system -->
      <path class="connector-line system" d="M800,242 L800,282" marker-end="url(#arrow-system)"/>

      <!-- System to student assessment -->
      <path class="connector-line system" d="M800,432 L800,488" marker-end="url(#arrow-system)"/>

      <!-- Student assessment to teacher view -->
      <path class="connector-line system" d="M800,618 L800,668" marker-end="url(#arrow-system)"/>

      <!-- Teacher view split to individual and common issues -->
      <path class="connector-line student" d="M800,798 C800,840 370,810 370,872" marker-end="url(#arrow-student)"/>
      <path class="connector-line teacher" d="M800,798 C800,840 1230,810 1230,872" marker-end="url(#arrow-teacher)"/>

      <!-- Issue to action -->
      <path class="connector-line student" d="M370,990 L370,1048" marker-end="url(#arrow-student)"/>
      <path class="connector-line teacher" d="M1230,990 L1230,1048" marker-end="url(#arrow-teacher)"/>

      <!-- Branches converge to closure -->
      <path class="connector-line system" d="M370,1198 C370,1232 610,1240 800,1258" marker-end="url(#arrow-system)"/>
      <path class="connector-line system" d="M1230,1198 C1230,1232 990,1240 800,1258" marker-end="url(#arrow-system)"/>

      <!-- Feedback loop from closure back to system -->
      <path class="connector-line dashed" d="M1100,1312 L1560,1312 L1560,357 L1100,357" marker-end="url(#arrow-purple)"/>
    </svg>

    <div class="loop-label">数据回流 · 持续更新</div>

    <div class="lane-label student">学 生 成 长 线</div>
    <div class="lane-label teacher">教 学 治 理 线</div>

    <section class="node input teacher">
      <h2 class="node-title">输入培养方案</h2>
      <p class="node-sub">教师提交岗位培养要求与实训标准</p>
    </section>

    <section class="node system">
      <h2 class="node-title">确定培养目标</h2>
      <p class="node-sub">星辰生成岗位能力星图与测评规则</p>
    </section>

    <section class="node student assessment">
      <h2 class="node-title">学生开展测评</h2>
      <p class="node-sub">完成能力测评并采集学习事件</p>
    </section>

    <section class="node teacher assessment">
      <h2 class="node-title">教师查看培养</h2>
      <p class="node-sub">查看个人星图与班级共性情况</p>
    </section>

    <section class="node insight issue">
      <h2 class="node-title">个性问题诊断</h2>
      <p class="node-sub">定位个人薄弱能力与知识缺口</p>
    </section>

    <section class="node teacher issue">
      <h2 class="node-title">共性问题识别</h2>
      <p class="node-sub">发现班级共性短板与教学重点</p>
    </section>

    <section class="node action">
      <h2 class="node-title">学生自主学习</h2>
      <p class="node-sub">按系统推荐完成资源学习与实训任务</p>
    </section>

    <section class="node teacher action">
      <h2 class="node-title">教师调整实训</h2>
      <p class="node-sub">结合反馈优化课程内容与实训安排</p>
    </section>

    <section class="node system closure">
      <h2 class="node-title">星图持续更新</h2>
      <p class="node-sub">学习证据回流并动态优化能力目标</p>
    </section>
  </div>

  <script>
    (function () {
      const starfield = document.getElementById("starfield");
      if (!starfield) return;
      const colors = ["#f8fafc", "#7dd3fc", "#5eead4", "#ddd6fe", "#fde68a"];
      const count = 96;
      for (let i = 0; i < count; i += 1) {
        const star = document.createElement("span");
        star.className = "star";
        const size = Math.random() * 2.6 + 1.1;
        const x = Math.random() * 1600;
        const y = Math.random() * 1420;
        const color = colors[Math.floor(Math.random() * colors.length)];
        star.style.left = x + "px";
        star.style.top = y + "px";
        star.style.width = size + "px";
        star.style.height = size + "px";
        star.style.background = color;
        star.style.boxShadow = "0 0 " + (Math.random() * 8 + 4) + "px rgba(56,189,248,0.7)";
        star.style.opacity = (Math.random() * 0.5 + 0.18).toFixed(2);
        starfield.appendChild(star);
      }
    })();
  </script>
</body>
</html>
